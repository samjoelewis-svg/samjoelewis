<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Editor · samlewis.fyi</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,600..800,0..100&display=swap">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div id="gate" class="gate"></div>
<div id="editor" class="editor" hidden>
  <header class="top">
    <div class="top-l"><span class="brand">samlewis</span><span class="brand-sub">Editor</span></div>
    <div class="top-c">
      <button class="ib" id="undo" title="Undo (Ctrl/Cmd Z)" aria-label="Undo" disabled><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button class="ib" id="redo" title="Redo (Ctrl/Cmd Shift Z)" aria-label="Redo" disabled><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
      <span class="sep"></span>
      <div class="seg" role="group" aria-label="Preview size">
        <button class="on" data-device="desktop" title="Desktop" aria-label="Desktop view"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg></button>
        <button data-device="mobile" title="Mobile" aria-label="Mobile view"><svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18.5h2"/></svg></button>
      </div>
      <button class="ib" id="previewBtn" title="Preview without editing tools" aria-label="Preview"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
    <div class="top-r">
      <span class="status" id="status" aria-live="polite"></span>
      <a class="lnk" href="../" target="_blank" rel="noopener">View live site</a>
      <button class="ib" id="visBtn" title="Visitors" aria-label="Visitors"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></button>
      <button class="btn-p" id="publish">Publish</button>
      <button class="ib" id="menuBtn" aria-label="More" aria-haspopup="true"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg></button>
      <div class="menu" id="menu" hidden>
        <button data-act="visitors">Visitors</button>
        <button data-act="discard">Discard unpublished changes</button>
        <button data-act="password">Change password</button>
        <button data-act="export">Download a backup of the content</button>
        <button data-act="help">How editing works</button>
        <button data-act="logout">Lock the editor</button>
      </div>
    </div>
  </header>
  <aside class="side" id="side"></aside>
  <main class="stage" id="stage"><div class="frame-wrap" id="frameWrap"><iframe id="frame" title="Site preview"></iframe></div></main>
</div>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input type="file" id="filePick" accept="image/*" hidden>
<input type="file" id="videoPick" accept="video/mp4" hidden>
<script src="admin.js"></script>
</body>
</html>
