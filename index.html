<style>
/* Layout: one teletext screen in a TV bezel, a remote control underneath. Pages swap inside the screen. */
:root {
  color-scheme: dark;
  --black: #000;
  --white: #f2f2f2;
  --red: #ff3434;
  --green: #35ff5a;
  --yellow: #fff13a;
  --blue: #2440ff;
  --magenta: #ff45ff;
  --cyan: #33f4ff;
  --dim: #8c8c8c;
  --bezel: #16161a;
  --bezel-edge: #26262c;
  --remote: #202026;
  --key: #2e2e36;
  --tt: "VT323", "Courier New", ui-monospace, monospace;
  --ui: "VT323", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { background: var(--bezel); }
body {
  color: var(--white);
  font-family: var(--tt);
  font-size: clamp(19px, 2.3vw, 24px);
  line-height: 1.18;
  padding-inline: 16px;
  padding-block: 24px 40px;
  -webkit-font-smoothing: none;
}
.wrap { max-width: 940px; margin-inline: auto; display: grid; gap: 22px; }

/* ---------- TV ---------- */
.tv {
  background: var(--bezel-edge);
  border-radius: 22px;
  padding: clamp(10px, 2vw, 22px);
  box-shadow: 0 1px 0 #34343c inset, 0 20px 50px #000a;
}
.screen {
  position: relative;
  background: var(--black);
  border-radius: 10px;
  padding: clamp(10px, 2.2vw, 22px) clamp(10px, 2.4vw, 26px) 12px;
  overflow: hidden;
  min-height: 540px;
  display: flex; flex-direction: column;
  box-shadow: 0 0 60px #2440ff18 inset;
}
.screen::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(to bottom, transparent 0 2px, #0000002e 2px 3px);
  border-radius: inherit;
}
.head {
  display: flex; flex-wrap: wrap; gap: 0 1.2ch; white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.head .p { color: var(--white); min-width: 4ch; }
.head .svc { color: var(--yellow); }
.head .clock { color: var(--yellow); margin-left: auto; }
.page { flex: 1; display: grid; gap: .7em; align-content: start; padding-top: .6em; }
.page:focus { outline: none; }

/* bands and double height */
.band { padding: .15em .6ch .1em; color: var(--black); }
.band.b-red { background: var(--red); }
.band.b-yellow { background: var(--yellow); }
.band.b-green { background: var(--green); }
.band.b-magenta { background: var(--magenta); }
.band.b-cyan { background: var(--cyan); }
.band.b-white { background: var(--white); }
.band.b-blue { background: var(--blue); color: var(--yellow); }
.band .kicker { display: flex; justify-content: space-between; gap: 1ch; flex-wrap: wrap; }
.dh { line-height: 2.25; padding-bottom: .45em; }
table { font-size: inherit; }
.frac { font-family: "IBM Plex Mono", "Courier New", monospace; font-size: .8em; font-weight: 500; letter-spacing: -.02em; }
.dh .w { display: inline-block; transform: scaleY(2); transform-origin: 50% 12%; vertical-align: top; line-height: 1; }
.band .dh { line-height: 2.1; }
.band.sec { padding: .25em .6ch .05em; }
.band.sec .dh { font-size: clamp(1.7em, 6vw, 2.6em); line-height: 1.85; padding-bottom: 0; }
.band.sec .kicker + .dh { font-size: clamp(1.35em, 4.2vw, 2em); margin-top: .12em; }
.crumbs .cur { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.c-red { color: var(--red); } .c-green { color: var(--green); } .c-yellow { color: var(--yellow); }
.c-blue { color: #7d8dff; } .c-magenta { color: var(--magenta); } .c-cyan { color: var(--cyan); }
.c-white { color: var(--white); } .c-dim { color: var(--dim); }
.bg-blue { background: var(--blue); color: var(--white); padding: .1em .6ch; }
.spec { background: var(--yellow); color: var(--black); padding: .1em .6ch; justify-self: start; }

/* mosaic masthead */
canvas.mosaic { display: block; width: 100%; height: auto; image-rendering: pixelated; }
.mast { background: var(--blue); display: grid; }
.mast-body { padding: .35em .8ch .45em; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .3em 2ch; align-items: center; }
.frame.portrait img.tt-portrait { position: absolute; inset: 0; width: 100%; height: 100%; max-height: none; object-fit: cover; image-rendering: pixelated; transition: opacity 1s steps(6); }
.portrait.resolved .tt-portrait { opacity: 0; }
@media (prefers-reduced-motion: reduce) { .portrait .tt-portrait { display: none; } }
.portrait.resolved:hover .tt-portrait { opacity: 1; transition-duration: .3s; }
.mast-text { display: grid; gap: .3em; min-width: 0; }
.mast .frame, .me .frame { width: clamp(110px, 20vw, 190px); cursor: zoom-in; }
.mast .frame img, .me .frame img { aspect-ratio: 1; object-fit: cover; }
.me { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 1em 2ch; align-items: start; }
@media (max-width: 520px) { .mast-body { grid-template-columns: minmax(0, 1fr); } .mast .frame { order: -1; } .me { grid-template-columns: minmax(0, 1fr); } }
.mast .sub { color: var(--white); }

/* index lists */
.toc { display: grid; gap: .12em; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 14em), 1fr)); gap: 1em 1.2ch; margin-top: .3em; }
.card { display: grid; align-content: start; gap: .1em; color: var(--white); text-decoration: none; }
.card .th { display: block; aspect-ratio: 16 / 10; overflow: hidden; border: 2px solid var(--white); background: #111; margin-bottom: .2em; }
.card .th { position: relative; }
.card .ttag { position: absolute; left: 0; top: 0; z-index: 1; background: var(--yellow); color: var(--black); padding: .05em .7ch; }
.card .th img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; display: block; }
.card .th.txt { display: grid; place-items: center; padding: .5em; text-align: center; color: var(--black); font-size: 1.5em; line-height: 1.05; }
.card .tt { display: flex; justify-content: space-between; gap: 1ch; padding: 0 .2ch; }
.card .tt .n { color: var(--yellow); font-variant-numeric: tabular-nums; }
.card .m { color: var(--cyan); padding: 0 .2ch; }
.card .q { color: var(--yellow); padding: 0 .2ch; }
.card:hover .th, .card:focus-visible .th { border-color: var(--yellow); }
.card:hover .tt, .card:focus-visible .tt { background: var(--white); color: var(--black); }
.card:hover .tt .n, .card:focus-visible .tt .n { color: var(--black); }
.card:focus-visible { outline: none; }
.toc a {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1ch;
  color: inherit; text-decoration: none; padding: 0 .4ch;
}
.toc a .t { overflow: hidden; white-space: nowrap; text-overflow: clip; }
.toc a .t::after { content: " ........................................................................................."; color: var(--dim); }
.toc a .n { color: var(--white); font-variant-numeric: tabular-nums; }
.toc a:hover, .toc a:focus-visible { background: var(--white); color: var(--black); outline: none; }
.toc a:hover .n, .toc a:focus-visible .n, .toc a:hover .t::after, .toc a:focus-visible .t::after { color: var(--black); }
.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .6em 3ch; }
.headlines a { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 1ch; color: var(--white); text-decoration: none; padding: 0 .4ch; }
.headlines a .n { color: var(--yellow); }
.fullport { display: block; background: var(--yellow); color: var(--black); text-decoration: none; padding: .15em .8ch; margin-top: .2em; }
.watch { justify-self: start; background: var(--yellow); color: var(--black); text-decoration: none; padding: .05em .8ch; margin-top: .6em; display: inline-block; }
.watch:hover, .watch:focus-visible { background: var(--white); outline: none; }
.fullport:hover, .fullport:focus-visible { background: var(--white); outline: none; }
.headlines { display: grid; gap: .15em; align-content: start; }
.headlines .tag { font-size: .8em; letter-spacing: .04em; }
.flash { animation: ttflash 2.4s steps(1, end) infinite; }
@keyframes ttflash { 0% { visibility: visible; } 60% { visibility: hidden; } }
@media (prefers-reduced-motion: reduce) { .flash { animation: none; } }
.headlines a:hover .tag, .headlines a:focus-visible .tag { color: var(--black); }
.headlines a:hover, .headlines a:focus-visible { background: var(--cyan); color: var(--black); outline: none; }
.headlines a:hover .n, .headlines a:focus-visible .n { color: var(--black); }

/* piece pages */
.piece { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: .8em 2.4ch; align-items: start; }
.facts { display: grid; gap: .45em; min-width: 0; }
.row { display: block; }
.row .l { margin-right: 1ch; }
.row .l { font-variant-numeric: tabular-nums; }
.meta { color: var(--cyan); }
.quote { color: var(--yellow); }
.facts .quote { line-height: 1.4; }
.prose { font-family: "IBM Plex Mono", ui-monospace, "Courier New", monospace; font-size: clamp(15px, 1.55vw, 16.5px); line-height: 1.6; color: var(--white); display: grid; gap: .85em; max-width: 64ch; -webkit-font-smoothing: antialiased; }
.prose p { margin: 0; text-wrap: pretty; }
.prose.wide { max-width: 68ch; padding-bottom: .4em; }

figure.pic { margin: 0; display: grid; gap: .25em; min-width: 0; }
.frame {
  position: relative; display: block; width: 100%; max-width: 100%; padding: 0; border: 0;
  background: #111; cursor: zoom-in; border: 3px solid var(--white);
}
.vframe { border: 2px solid var(--white); background: #000; }
.vframe video { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; }
.frame img { display: block; width: 100%; height: auto; max-height: 440px; object-fit: contain; background: #000; }
.piece > figure.pic .frame { width: fit-content; max-width: 100%; }
.piece > figure.pic .frame img { width: auto; max-width: 100%; max-height: 600px; }
.frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; transition: opacity .5s steps(5); }
.frame:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
.stack { display: grid; gap: 1em; min-width: 0; }
.piece.solo { grid-template-columns: minmax(0, 1fr); }
.piece.solo .prose { max-width: 68ch; }
.gallery { display: flex; gap: 1.5ch; margin-top: 1em; align-items: flex-start; }
.gallery .gi { min-width: 0; }
.gallery .frame img { max-height: none; }
@media (max-width: 560px) { .gallery { flex-direction: column; max-width: none !important; } .gallery .gi { flex: none !important; width: 100%; } }
.pics2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.2ch; }
figcaption { color: var(--dim); font-size: .8em; line-height: 1.2; }
#email { overflow-wrap: anywhere; }
.row > span { min-width: 0; overflow-wrap: anywhere; }
.cvjobs { display: grid; gap: .8em; }
.cvb { margin: .3em 0 0; padding-left: 10ch; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: clamp(14px, 1.45vw, 15.5px); line-height: 1.5; display: grid; gap: .25em; -webkit-font-smoothing: antialiased; }
.cvb li::marker { color: var(--dim); }
@media (max-width: 560px) { .cvb { padding-left: 1.3em; } }
.cv { display: grid; gap: .1em; font-variant-numeric: tabular-nums; }
.cvrow { display: grid; grid-template-columns: 8ch minmax(0, 1fr) minmax(0, 1fr); gap: 0 1.5ch; }
@media (max-width: 560px) { .cvrow { grid-template-columns: 8ch minmax(0, 1fr); } .cvrow > :last-child { grid-column: 2; } }
.scorewide { display: grid; gap: .3em; }

.scores { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.scores td { padding: .1em .6ch; }
.scores tr:nth-child(odd) td { color: var(--white); }
.scores tr:nth-child(even) td { color: var(--cyan); }
.scores td:last-child { text-align: right; color: var(--yellow); }
.bigstats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1ch; }
.bigstats.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.bigstats div { background: var(--blue); padding: .3em .8ch .2em; }
.bigstats b { display: block; font-weight: normal; color: var(--yellow); }

.fastext {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 1ch;
  margin-top: .8em; padding-top: .3em;
}
.fastext:empty { display: none; }
.crumbs { display: flex; align-items: baseline; gap: 1.2ch; flex-wrap: nowrap; white-space: nowrap; min-width: 0; max-width: 100%; overflow: hidden; contain: inline-size; margin: .15em 0 .5em; text-transform: uppercase; }
.crumbs:empty { display: none; }
.crumbs button { font: inherit; text-transform: inherit; background: none; border: 0; padding: 0 .3ch; cursor: pointer; color: var(--cyan); }
.crumbs .back { background: var(--white); color: var(--black); padding: 0 .8ch; }
.crumbs .path { display: flex; flex-wrap: nowrap; align-items: baseline; gap: 0 .6ch; min-width: 0; overflow: hidden; }
.crumbs .back { flex: none; }
.crumbs .sep { color: var(--dim); }
.crumbs .here { color: var(--white); }
.crumbs button:hover, .crumbs button:focus-visible { background: var(--yellow); color: var(--black); outline: none; }
.fastext .sec { justify-self: center; }
.fastext button {
  font: inherit; background: none; border: 0; padding: 0 .3ch; text-align: left; cursor: pointer;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.fastext button { color: var(--white); }
.fastext button:hover, .fastext button:focus-visible { background: var(--white); color: var(--black); outline: none; }
.fastext button:hover span, .fastext button:focus-visible span { color: var(--black); }

/* ---------- Remote ---------- */
.remote {
  background: var(--remote); border-radius: 18px; padding: 16px clamp(12px, 3vw, 24px);
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px 22px; align-items: center;
  box-shadow: 0 1px 0 #34343c inset;
}
.entry {
  background: #000; color: var(--yellow); padding: .15em .8ch; min-width: 7ch; text-align: center;
  font-variant-numeric: tabular-nums; border-radius: 4px; border: 1px solid #333;
}
.keys { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px; }
.key, .rbtn {
  font: inherit; color: var(--white); background: var(--key); border: 0; border-radius: 8px;
  padding: .25em 0; cursor: pointer; box-shadow: 0 2px 0 #0008;
}
.key:hover, .rbtn:hover { background: #3b3b45; }
.key:active, .rbtn:active { transform: translateY(1px); box-shadow: none; }
.key:focus-visible, .rbtn:focus-visible { outline: 2px solid var(--yellow); outline-offset: 2px; }
.side { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, minmax(0, 76px)); gap: 10px; }
.fkw { font: inherit; background: none; border: 0; padding: 0; cursor: pointer; display: grid; justify-items: center; gap: 3px; color: var(--dim); }
.fkw { min-width: 0; align-content: start; }
.fkw .fl { font-size: .72em; line-height: 1.1; white-space: nowrap; min-height: 1em; text-align: center; }
.fkw .fl { white-space: normal; }
.fkw:hover .fl { color: var(--white); }
.fkw[aria-current="true"] .fl { color: var(--white); }
.fkw[aria-current="true"] .fk { outline: 2px solid var(--white); outline-offset: 2px; }
.fkw:focus-visible { outline: 2px solid var(--yellow); outline-offset: 3px; border-radius: 6px; }
.fk { display: block; width: 34px; height: 22px; border: 0; border-radius: 11px; box-shadow: 0 2px 0 #0008; }
.fk.red { background: var(--red); } .fk.green { background: var(--green); } .fk.yellow { background: var(--yellow); } .fk.magenta { background: var(--magenta); } .fk.cyan { background: var(--cyan); }
.rbtns { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.rbtn { padding: .2em 1.4ch; }
.rbtn[aria-pressed="true"] { background: var(--white); color: var(--black); }
.help { color: var(--dim); margin-left: auto; }

/* lightbox */
.lb[hidden] { display: none; }
.lb { position: fixed; inset: 0; background: #000e; display: grid; place-items: center; padding: 24px; z-index: 10; }
.lb img { max-width: 100%; max-height: calc(100vh - 110px); width: auto; height: auto; border: 3px solid var(--white); }
.lb .bar { display: flex; justify-content: space-between; gap: 2ch; width: min(100%, 1100px); margin-bottom: 10px; }
.lb button { font: inherit; background: var(--white); color: var(--black); border: 0; padding: 0 1.2ch; cursor: pointer; }
.lb-inner { display: grid; justify-items: center; }

@media (max-width: 720px) {
  .piece { grid-template-columns: minmax(0, 1fr); }
  .piece figure.pic { order: -1; }
  .cols { grid-template-columns: minmax(0, 1fr); }
  .remote { grid-template-columns: minmax(0, 1fr); }
  .side { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .keys { grid-column: 1 / -1; grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .help { margin-left: 0; width: 100%; }
  .screen { min-height: 0; }
  .fastext { grid-template-columns: auto minmax(0, 1fr) auto; }
  .fastext { grid-template-columns: auto auto; justify-content: space-between; }
  .fastext .sec { display: none; }
  .crumbs .cur, .crumbs .hm { display: none; }
  .bigstats { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  .frame canvas { transition: none; }
}

/* ---------- desktop: use the width, keep the home page above the fold ---------- */
.wrap { max-width: 1480px; }
.toc { align-content: start; }
@media (min-width: 721px) { .cols { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); } }
.mast canvas.mosaic { width: auto; max-width: 100%; height: clamp(60px, 13vh, 130px); }
.mast .frame { width: clamp(96px, min(20vw, 18vh), 190px); }
@media (min-width: 721px) {
  body { font-size: clamp(17px, min(2.3vw, 2.9vh), 24px); padding-block: 18px 32px; }
}
@media (min-width: 1100px) {
  .wrap { grid-template-columns: minmax(0, 1fr) 236px; align-items: start; }
  .remote { grid-template-columns: minmax(0, 1fr); position: sticky; top: 18px; padding: 16px; }
  .entry { justify-self: stretch; }
  .keys { grid-column: auto; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .keys .key:last-child { grid-column: 2; }
  .side { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 12px; }
  .rbtns .rbtn { flex: 1; }
  .help { margin-left: 0; width: 100%; font-size: .8em; }
}
</style>
</head>
<body>

<div class="wrap">
  <div class="tv">
    <div class="screen" id="screen">
      <div class="head" aria-hidden="true">
        <span class="p" id="hp">P100</span>
        <span class="svc">SAM LEWIS</span>
        <span class="clock" id="clock"></span>
      </div>
      <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
      <main class="page" id="page" tabindex="-1" aria-live="polite"></main>
      <nav class="fastext" id="fastext" aria-label="Fastext links"></nav>
    </div>
  </div>

  <div class="remote" aria-label="Remote control">
    <div class="entry" id="entry" aria-live="polite">P___</div>
    <div class="keys" id="keys"></div>
    <div class="side" id="side">
      <button class="fkw" data-go="200" data-sec="200" aria-label="Movies and TV, page 200"><span class="fk red"></span><span class="fl">Movies &amp; TV</span></button>
      <button class="fkw" data-go="400" data-sec="400" aria-label="Sport, page 400"><span class="fk green"></span><span class="fl">Sport</span></button>
      <button class="fkw" data-go="500" data-sec="500" aria-label="Arts and culture, page 500"><span class="fk magenta"></span><span class="fl">Culture</span></button>
      <button class="fkw" data-go="600" data-sec="600" aria-label="EdTech, page 600"><span class="fk cyan"></span><span class="fl">EdTech</span></button>
    </div>
    <div class="rbtns">
      <button class="rbtn" id="toIndex">HOME</button>
      <span class="help">Type a page number, or press a colour to jump to that section</span>
    </div>
  </div>
</div>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Picture">
  <div class="lb-inner">
    <div class="bar"><span class="c-cyan" id="lbcap"></span><button id="lbclose">CLOSE</button></div>
    <img id="lbimg" alt="">
  </div>
</div>

<script>
(() => {
/* ---------- content ---------- */
const CH = {

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const frac = s => s.replace(/\u00BE/g, '<span class="frac">\u00BE</span>');
const dh = (text, cls = "") => `<div class="dh ${cls}">${esc(text).split(" ").map(w => `<span class="w">${frac(w)}</span>`).join(" ")}</div>`;
const chapterOf = n => n >= 800 && n < 888 ? 800 : n >= 750 && n < 800 ? 750 : Math.floor(n / 100) * 100;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

function band(n, title) {
  const ch = CH[chapterOf(n)];
  return `<div class="band b-${ch.colour} sec">${n !== chapterOf(n) ? `<div class="kicker"><span>${ch.name}</span></div>` : ""}${dh(title)}</div>`;
}
function pic([file, cap]) {
  return `<figure class="pic"><button class="frame" data-src="img/${file}.jpg" data-cap="${esc(cap)}" aria-label="Enlarge picture: ${esc(cap)}">
    <img src="img/${file}.jpg" alt="${esc(cap)}" loading="lazy" decoding="async"></button><figcaption>${esc(cap)}</figcaption></figure>`;
}
function row(label, colour, text) {
  return text ? `<div class="row"><span class="l c-${colour}">${label}</span><span>${esc(text)}</span></div>` : "";
}

      "Create English master copy for 15+ EMEA markets, working with regional teams to retain the intent and tone through localisation.",
      "Shape tone of voice across distinct brands and audiences; collaborate with designers, marketers and strategists, presenting creative work to senior stakeholders.",
      "Line manage and mentor two junior copywriters, giving creative direction and feedback from concept to final copy."]],
    ["2020\u201321", "FutureLearn", "Copywriter", [
      "Developed brand, product, CRM and OOH copy across the learner journey, from campaign messaging to product communications.",
      "Translated complex education subjects into clear, accessible brand, product and long-form editorial copy.",
      "Worked with Google and LEGO to develop campaign messaging that made complex ideas easy to understand."]],
    ["2015\u201319", "AKA UK", "Concept Copywriter & Creative", [
      "Concepted integrated campaigns for Tate Modern, the National Theatre, the British Library, the Natural History Museum and Matilda the Musical.",
      "Developed ideas from brief to execution across film, radio, OOH, digital and social, writing scripts, headlines and longer-form copy.",
      "Worked closely with designers and strategists, presenting and selling creative concepts to clients and senior stakeholders."]],
    ["2012\u201314", "Empire Design", "Junior Copywriter", [
      "Developed concepts, taglines and scripts for theatrical and home-entertainment campaigns for Universal Studios, Fox, AMC and Canal Plus.",
      "Wrote trailer, radio, OOH, digital and social copy for film and television launches."]],
    ["2005\u201315", "Freelance", "Copywriter, Journalist & Proofreader", [
      "Wrote and proofread for private clients and cultural publications; researched, interviewed and wrote music and film features and reviews."]],
  ];
  return `<div class="band b-yellow sec">${dh("CONTACT & CV")}</div>
    <div class="me"><button class="frame" data-src="img/sam.jpg" data-cap="Sam Lewis" aria-label="Enlarge photo of Sam Lewis"><img src="img/sam.jpg" alt="Sam Lewis"></button>
    <div class="facts">
      <div class="row"><span class="l c-cyan">EMAIL</span><span><span class="c-yellow" id="email">sam.joe.lewis@gmail.com</span> <button class="rbtn" id="copyEmail" style="font-size:.9em;padding:0 1ch">COPY</button> <span class="c-dim" id="copied" hidden>Copied</span></span></div>
      <div class="row"><span class="l c-cyan">LINKEDIN</span><span><a class="c-yellow" href="https://www.linkedin.com/in/sam-lewis-495992134/" target="_blank" rel="noopener">sam-lewis-495992134</a></span></div>
      <div class="row"><span class="l c-cyan">BASED</span><span>London</span></div>
    </div></div>
    <div class="prose wide"><p>Senior copywriter with over a decade of agency and in-house experience turning strategic briefs into integrated campaigns for global brands. Concept and execution across video, social, digital, OOH, radio and CRM, with particular strength in brand voice, multi-market work and conversion-focused subscription journeys. Clients and brands include HBO Max, TNT Sports, Google, LEGO, Tate Modern and the National Theatre.</p></div>
    <div class="c-cyan">EXPERIENCE</div>
    <div class="cvjobs">${cv.map(([d, co, role, bs]) => `<div class="cvjob">
      <div class="cvrow"><span class="c-yellow">${d}</span><span>${esc(co)}</span><span class="c-cyan">${esc(role)}</span></div>
      <ul class="cvb">${bs.map(b => `<li>${esc(b)}</li>`).join("")}</ul></div>`).join("")}</div>
    <div class="c-cyan">EDUCATION & TOOLS</div>
    <div class="cv">
      <div class="cvrow"><span class="c-yellow">MA</span><span>UCL</span><span class="c-cyan">English Literature</span></div>
      <div class="cvrow"><span class="c-yellow">BA</span><span>University of Manchester</span><span class="c-cyan">English Literature</span></div>
      <div class="cvrow"><span class="c-yellow">CERT</span><span>Society for Editors &amp; Proofreaders</span><span class="c-cyan">Proofreading 1</span></div>
      <div class="cvrow"><span class="c-yellow">TOOLS</span><span>Figma, Google Docs, Google Slides, Adobe</span><span></span></div>
    </div>
    <div class="c-dim">Thanks for watching. Normal service resumes on page 100.</div>`;
}

function pageMissing(n) {
  return `<div class="band b-red"><div class="kicker"><span>PAGE ${n}</span></div>${dh("PAGE NOT IN SERVICE")}</div>
    <div>There's nothing on page ${n}. Try the home page on <a class="c-cyan" href="#p100" data-go="100">100</a>.</div>`;
}

function render(n) {
  if (n === 100) return pageIndex();
  if (n === 101) return pageAbout();
  if (CHAPTERS[n]) return pageChapter(n);
  if (PIECES[n]) return pagePiece(n);
  if (n === 700) return pageVoice();
  if (n === 750) return pageLeadership();
  if (n === 800) return pageOffDuty();
  if (n === 888) return pageSubtitles();
  return null;
}

/* ---------- fastext ---------- */
const NAV = { 200: "Movies & TV", 400: "Sport", 500: "Arts & culture", 600: "EdTech" };
const NAMES = { ...NAV, 101: "About", 700: "Brand voice", 750: "Leadership", 800: "Journalism", 888: "Contact & CV" };
function drawCrumbs(n) {
  const el = $("#crumbs");
  if (n === 100 || !(NAMES[n] || PIECES[n])) { el.innerHTML = ""; return; }
  const ch = chapterOf(n), inSec = !!PIECES[n] && !!NAV[ch];
  const parent = inSec ? ch : 100;
  const here = PIECES[n] ? PIECES[n].title : NAMES[n];
  el.innerHTML = `<button class="back" data-go="${parent}">\u2039 Back</button>` +
    `<span class="path"><button data-go="100"${inSec ? ' class="hm"' : ""}>Home</button>` +
    (inSec ? `<span class="sep hm">\u203A</span><button data-go="${ch}">${esc(NAV[ch])}</button>` : "") +
    `<span class="cur"><span class="sep">\u203A</span> <span class="here" aria-current="page">${esc(here)}</span></span></span>`;
}

function drawFastext(n) {
  drawCrumbs(n);
  const ch = chapterOf(n);
  document.querySelectorAll(".fkw").forEach(b => b.setAttribute("aria-current", String(Number(b.dataset.sec) === ch && n !== 100)));
  const i = ORDER.indexOf(n);
  if (n === 100 || i < 0) { $("#fastext").innerHTML = ""; return; }
  const prev = ORDER[i - 1], next = ORDER[i + 1];
  const secN = CHAPTERS[ch] && n !== ch ? ch : 100;
  const secLabel = secN === 100 ? "Home" : NAV[ch];
  $("#fastext").innerHTML =
    (prev ? `<button data-go="${prev}" aria-label="Previous page, ${prev}"><span>\u2039 Previous</span></button>` : `<span></span>`) +
    `<button class="sec" data-go="${secN}"><span>${esc(secLabel)}</span></button>` +
    (next ? `<button data-go="${next}" aria-label="Next page, ${next}"><span>Next \u203A</span></button>` : `<span></span>`);
}

/* ---------- navigation ---------- */
let current = 100, timer = null;
function go(n, push = true) {
  n = Number(n);
  clearInterval(timer);
  const hp = $("#hp");
  const finish = () => {
    hp.textContent = "P" + n;
    const html = render(n);
    const pageEl = $("#page");
    pageEl.innerHTML = html ?? pageMissing(n);
    current = n;
    drawFastext(n);
    afterRender(n);
    if (push && location.hash !== "#p" + n) { try { history.pushState(null, "", "#p" + n); } catch (e) {} }
    pageEl.focus({ preventScroll: true });
    const sc = $("#screen"); if (sc.getBoundingClientRect().top < 0) sc.scrollIntoView({ block: "start" });
  };
  if (reduced) return finish();
  let k = current, steps = 0;
  timer = setInterval(() => {
    k = k >= 899 ? 100 : k + 7 + Math.floor(Math.random() * 13);
    hp.textContent = "P" + String(k).padStart(3, "0");
    if (++steps > 6) { clearInterval(timer); finish(); }
  }, 45);
}

document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]");
  if (g) { e.preventDefault(); go(g.dataset.go); return; }
  const fr = e.target.closest(".frame");
  if (fr) { openLb(fr.dataset.src, fr.dataset.cap); return; }
});

/* page number entry */
let buf = "";
function key(d) {
  buf += d;
  $("#entry").textContent = "P" + buf.padEnd(3, "_");
  if (buf.length === 3) {
    const n = Number(buf); buf = "";
    setTimeout(() => { $("#entry").textContent = "P___"; }, 400);
    if (n >= 100) go(n); else go(n);
  }
}
$("#keys").innerHTML = [1, 2, 3, 4, 5, 6, 7, 8, 9, 0].map(d => `<button class="key" data-k="${d}" aria-label="Number ${d}">${d}</button>`).join("");
$("#keys").addEventListener("click", e => { const b = e.target.closest("[data-k]"); if (b) key(b.dataset.k); });

$("#toIndex").addEventListener("click", () => go(100));

document.addEventListener("keydown", e => {
  if (!$("#lb").hidden) { if (e.key === "Escape") closeLb(); return; }
  if (e.target.closest("input, textarea")) return;
  if (/^[0-9]$/.test(e.key)) { key(e.key); return; }
  const i = ORDER.indexOf(current);
  if (e.key === "ArrowRight") go(ORDER[(i + 1) % ORDER.length]);
  else if (e.key === "ArrowLeft") go(ORDER[(i - 1 + ORDER.length) % ORDER.length]);
});

/* ---------- clock ---------- */
function tick() {
  const d = new Date();
  const days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], mons = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const p = x => String(x).padStart(2, "0");
  $("#clock").textContent = `${days[d.getDay()]} ${p(d.getDate())} ${mons[d.getMonth()]} ${p(d.getHours())}:${p(d.getMinutes())}/${p(d.getSeconds())}`;
}
tick(); setInterval(tick, 1000);

/* ---------- mosaics ---------- */
const FONT = {
  S: ["####", "#...", "####", "...#", "####"], A: [".##.", "#..#", "####", "#..#", "#..#"],
  M: ["#...#", "##.##", "#.#.#", "#...#", "#...#"], L: ["#...", "#...", "#...", "#...", "####"],
  E: ["####", "#...", "###.", "#...", "####"], W: ["#...#", "#...#", "#.#.#", "##.##", "#...#"],
  I: ["###", ".#.", ".#.", ".#.", "###"], " ": ["..", "..", "..", "..", ".."],
};
const ttcol = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function drawMast() {
  const c = $("#mastCanvas"); if (!c) return;
  const text = "SAM LEWIS", sw = 10, sh = 12, pad = 1;
  const glyphs = [...text].map(ch => FONT[ch]);
  const w = glyphs.reduce((s, g) => s + g[0].length + 1, 0) - 1 + pad * 2 + 1, h = 5 + pad * 2 + 1;
  c.width = w * sw; c.height = h * sh;
  const ctx = c.getContext("2d");
  ctx.fillStyle = ttcol("--blue"); ctx.fillRect(0, 0, c.width, c.height);
  const rows = ["--red", "--yellow", "--green", "--cyan", "--white"];
  const plot = (dx, dy, fill) => {
    let x = pad;
    glyphs.forEach(g => {
      g.forEach((r, y) => [...r].forEach((b, i) => {
        if (b !== "#") return;
        ctx.fillStyle = fill(y);
        ctx.fillRect((x + i + dx) * sw, (y + pad + dy) * sh, sw, sh);
      }));
      x += g[0].length + 1;
    });
  };
  plot(1, 1, () => "#000");
  plot(0, 0, y => ttcol(rows[y]));
  c.style.maxWidth = (w * 15) + "px";
}
function drawPortrait(btn) {
  if (!btn || reduced) return;
  setTimeout(() => btn.classList.add("resolved"), 2600);
}
function drawPitch() {
  const c = $("#pitchCanvas"); if (!c) return;
  const W = 48, H = 30, cell = 8;
  c.width = W * cell; c.height = H * cell;
  const ctx = c.getContext("2d"), css = getComputedStyle(document.documentElement);
  const col = v => css.getPropertyValue(v).trim();
  const px = (x, y, v) => { ctx.fillStyle = col(v); ctx.fillRect(x * cell, y * cell, cell, cell); };
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) px(x, y, (Math.floor(x / 4) % 2) ? "--green" : "--black");
  ctx.globalAlpha = 1;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (Math.floor(x / 4) % 2 === 0) { ctx.fillStyle = "#0a7a1f"; ctx.fillRect(x * cell, y * cell, cell, cell); }
  const L = (x, y) => px(x, y, "--white");
  for (let x = 2; x < W - 2; x++) { L(x, 2); L(x, H - 3); }
  for (let y = 2; y < H - 2; y++) { L(2, y); L(W - 3, y); L(W / 2, y); }
  for (let a = 0; a < 360; a += 6) { const r = 5; L(Math.round(W / 2 + r * Math.cos(a * Math.PI / 180)), Math.round(H / 2 + r * .9 * Math.sin(a * Math.PI / 180))); }
  for (let y = 8; y <= H - 9; y++) { L(9, y); L(W - 10, y); }
  for (let x = 2; x <= 9; x++) { L(x, 8); L(x, H - 9); }
  for (let x = W - 10; x < W - 2; x++) { L(x, 8); L(x, H - 9); }
  for (let y = 12; y <= H - 13; y++) { px(1, y, "--yellow"); px(W - 2, y, "--yellow"); }
  px(W - 14, 12, "--white"); px(W - 13, 12, "--white"); px(W - 14, 13, "--white"); px(W - 13, 13, "--white");
  const trail = [[6, 26], [12, 22], [19, 19], [26, 16], [31, 14]];
  trail.forEach(([x, y], i) => { ctx.globalAlpha = .25 + i * .15; px(x, y, "--yellow"); });
  ctx.globalAlpha = 1;
}

/* picture reveal: chunky pixels resolve into the real image */
function pixelIn(frame) {
  const img = frame.querySelector("img");
  if (reduced) return;
  const run = () => {
    if (!img.naturalWidth) return;
    const cv = document.createElement("canvas");
    const w = 36, h = Math.max(1, Math.round(w * img.naturalHeight / img.naturalWidth));
    cv.width = w; cv.height = h;
    cv.getContext("2d").drawImage(img, 0, 0, w, h);
    frame.appendChild(cv);
    setTimeout(() => { cv.style.opacity = "0"; }, 380);
    setTimeout(() => cv.remove(), 1000);
  };
  if (img.complete) run(); else img.addEventListener("load", run, { once: true });
}

function afterRender(n) {
  drawMast(); drawPitch(); drawPortrait($(".portrait"));
  document.querySelectorAll(".frame:not(.portrait)").forEach(pixelIn);
  const cp = $("#copyEmail");
  if (cp) cp.addEventListener("click", () => {
    const t = $("#email").textContent;
    const done = () => { const c = $("#copied"); c.hidden = false; setTimeout(() => c.hidden = true, 1500); };
    try {
      navigator.clipboard.writeText(t).then(done, () => selectEmail());
    } catch (e) { selectEmail(); }
  });
}
function selectEmail() {
  const r = document.createRange(); r.selectNodeContents($("#email"));
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
}

/* lightbox */
let lastFocus = null;
function openLb(src, cap) {
  lastFocus = document.activeElement;
  $("#lbimg").src = src; $("#lbimg").alt = cap; $("#lbcap").textContent = cap;
  $("#lb").hidden = false; $("#lbclose").focus();
}
function closeLb() { $("#lb").hidden = true; if (lastFocus) lastFocus.focus(); }
$("#lbclose").addEventListener("click", closeLb);
$("#lb").addEventListener("click", e => { if (e.target.id === "lb") closeLb(); });

window.addEventListener("popstate", () => {
  const h = /^#p(\d{3})$/.exec(location.hash || "");
  const n = h ? Number(h[1]) : 100;
  if (n !== current) go(n, false);
});

/* boot */
const m = /^#p(\d{3})$/.exec(location.hash || "");
const start = m ? Number(m[1]) : 100;
hnInit();
function hnInit() { $("#hp").textContent = "P" + start; }
current = start;
$("#page").innerHTML = render(start) ?? pageMissing(start);
drawFastext(start);
afterRender(start);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { drawMast(); });
})();
</script>
