name: Import Westminster Abbey photo
on:
  push:
    paths:
      - .github/workflows/import-westminster-abbey-photo.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  add-photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch user-supplied Westminster Abbey photo
        env:
          CANVA_ASSET_URL: 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F37389bb6-e36e-43b2-9d34-5c6e7b50b153/watermark:F/width:150?csig=AAAAAAAAAAAAAAAAAAAAAB8wVrFOw8EsoOzyvxM2tVhXpU7p1Q-qsN-kno9Tsy5m&exp=1792780071&osig=AAAAAAAAAAAAAAAAAAAAADGC_9nKKyKYvKWac5tleUzyuOvcTCceXfcTtzHe_Wck&signer=media-rpc&token=AAIAAU0AJDM3Mzg5YmI2LWUzNmUtNDNiMi05ZDM0LTVjNmU3YjUwYjE1MwAAAAABoWoE8Fh8dhXwNYI4vgRefk9NehJHoHjlANbsD83vaqBnqFrrsg&x-canva-quality=thumbnail'
        shell: bash
        run: |
          python3 -m pip install --quiet pillow requests
          python3 - <<'PY'
          import io, os, requests
          from PIL import Image
          from pathlib import Path
          original = os.environ["CANVA_ASSET_URL"]
          candidates = [
              original.replace('height:200/', 'height:1000/').replace('/width:150?', '/width:750?').replace('&x-canva-quality=thumbnail', ''),
              original
          ]
          choices = []
          for url in candidates:
              try:
                  resp = requests.get(url, timeout=25)
                  resp.raise_for_status()
                  im = Image.open(io.BytesIO(resp.content)).convert("RGB")
                  choices.append(im)
                  print("Downloaded image", im.size)
              except Exception as exc:
                  print("Candidate unavailable", type(exc).__name__)
          if not choices:
              raise SystemExit("Photo was not downloaded. Leaving portfolio unchanged.")
          im = max(choices, key=lambda x: x.width*x.height)
          if im.width < 300:
              print("Source only has a small signed thumbnail; supporting image will be small.")
          im.thumbnail((1050, 1400))
          dest = Path("img/westminster-abbey-bond-street.webp")
          dest.parent.mkdir(parents=True, exist_ok=True)
          im.save(dest, "WEBP", quality=83, method=6)
          print("Saved", dest, im.size, dest.stat().st_size)
          PY
      - name: Commit photograph to source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/westminster-abbey-bond-street.webp
          if ! git diff --cached --quiet; then
            git commit -m "Add Westminster Abbey Bond Street campaign photo"
            git push origin HEAD:main
          fi
